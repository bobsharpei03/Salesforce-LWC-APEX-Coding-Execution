<template>
    <lightning-card title="Contact Information">

        <div class="slds-p-around_medium">

            <lightning-input
                name="firstName"
                label="First Name"
                value={firstName}
                onchange={handleChange}>
            </lightning-input>

            <lightning-input
                name="lastName"
                label="Last Name"
                value={lastName}
                required
                onchange={handleChange}>
            </lightning-input>

            <lightning-input
                name="email"
                label="Email"
                type="email"
                value={email}
                required
                onchange={handleChange}>
            </lightning-input>

            <div class="slds-m-top_medium slds-text-align_right">
                <lightning-button variant="neutral" label="Back" onclick={handleBack}></lightning-button>
                <lightning-button variant="brand" label="Next" class="slds-m-left_small" onclick={handleNext}></lightning-button>
            </div>

        </div>

    </lightning-card>
</template>
