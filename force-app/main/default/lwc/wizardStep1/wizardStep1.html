<template>
    <lightning-card title="Step 1 — Account Information" class="slds-p-around_medium">

        <div class="slds-grid slds-wrap slds-gutters">
            <div class="slds-col slds-size_1-of-1">
                <lightning-input 
                    name="accountName"
                    label="Account Name"
                    value={accountName}
                    onchange={handleChange}
                    required>
                </lightning-input>
            </div>

            <div class="slds-col slds-size_1-of-1 slds-m-top_medium">
                <lightning-combobox
                    name="industry"
                    label="Industry"
                    value={industry}
                    options={industryOptions}
                    onchange={handleChange}>
                </lightning-combobox>
            </div>
        </div>

        <div class="slds-m-top_large slds-text-align_right">
            <lightning-button 
                variant="brand"
                label="Next"
                onclick={handleNext}>
            </lightning-button>
        </div>

    </lightning-card>
</template>
