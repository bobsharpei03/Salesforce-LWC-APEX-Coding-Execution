<template>
    <lightning-card title="Review Your Information">

        <div class="slds-p-around_medium">

            <!-- Account Section -->
            <h2 class="slds-text-heading_small slds-m-bottom_small">Account</h2>
            <p><strong>Name:</strong> {accountName}</p>
            <p><strong>Industry:</strong> {industry}</p>

            <div class="slds-border_bottom slds-m-vertical_medium"></div>

            <!-- Contact Section -->
            <h2 class="slds-text-heading_small slds-m-bottom_small">Contact</h2>
            <p><strong>First Name:</strong> {firstName}</p>
            <p><strong>Last Name:</strong> {lastName}</p>
            <p><strong>Email:</strong> {email}</p>

            <div class="slds-border_bottom slds-m-vertical_medium"></div>

            <!-- Preferences Section -->
            <h2 class="slds-text-heading_small slds-m-bottom_small">Preferences</h2>
            <p><strong>Preference:</strong> {preferences}</p>

            <!-- Buttons -->
            <div class="slds-m-top_large slds-text-align_right">
                <lightning-button
                    variant="neutral"
                    label="Back"
                    onclick={handleBack}>
                </lightning-button>

                <lightning-button
                    variant="brand"
                    label="Submit"
                    class="slds-m-left_small"
                    onclick={handleSubmit}>
                </lightning-button>
            </div>

        </div>

    </lightning-card>
</template>
